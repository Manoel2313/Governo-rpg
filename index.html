<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Karma: Governando Nações</title>
<style>
  :root{
    --bg:#0e141e;
    --bg2:#141c2a;
    --card:#1a2333;
    --card2:#212c40;
    --gold:#e8c87a;
    --gold-dim:#a98f56;
    --text:#eef1f6;
    --text-dim:#9aa7bd;
    --green:#4caf50;
    --red:#e74c3c;
    --blue:#4a90d9;
    --purple:#9b59b6;
    --cyan:#00bcd4;
    --yellow:#e8c435;
    --lightblue:#5dade2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI', Arial, sans-serif; overflow:hidden;
  }
  body{ position:fixed; inset:0; }
  #app{ width:100vw; height:100vh; position:relative; }

  .screen{
    display:none; width:100%; height:100%; position:absolute; inset:0;
    overflow-y:auto; overflow-x:hidden;
    padding:2vh 3vw;
  }
  .screen.active{ display:flex; flex-direction:column; animation:fadeIn 0.45s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(1.5vh);} to{opacity:1; transform:translateY(0);} }
  .hidden{ display:none !important; }

  h1,h2,h3{ color:var(--gold); font-weight:700; letter-spacing:0.5px; }
  h1{ font-size:4.2vh; }
  h2{ font-size:3.2vh; }
  h3{ font-size:2.4vh; }
  p, span, div{ font-size:2vh; }

  .btn{
    background:linear-gradient(180deg, var(--card2), var(--card));
    border:2px solid #34405a;
    color:var(--text);
    border-radius:1.2vh;
    padding:1.8vh 2.4vw;
    font-size:2.1vh;
    font-weight:600;
    cursor:pointer;
    transition:all 0.15s ease;
    box-shadow:0 0.4vh 0 rgba(0,0,0,0.35);
  }
  .btn:hover{ transform:translateY(-0.3vh); box-shadow:0 0.8vh 1.2vh rgba(232,200,122,0.15); border-color:var(--gold-dim); }
  .btn:active{ transform:translateY(0.1vh); box-shadow:0 0.1vh 0 rgba(0,0,0,0.3); }
  .btn.selected{ background:linear-gradient(180deg, var(--gold), var(--gold-dim)); color:#1a1305; border-color:var(--gold); }
  .btn.big{ font-size:2.6vh; padding:2.4vh 4vw; }
  .btn.primary{ background:linear-gradient(180deg, var(--gold), #c9a860); color:#1a1305; border-color:var(--gold); }
  .btn.danger{ background:linear-gradient(180deg, #8a2b2b, #5c1c1c); border-color:#a53f3f; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  .btn.small{ font-size:1.7vh; padding:1.2vh 1.6vw; }

  .row{ display:flex; flex-wrap:wrap; gap:1.4vh; }
  .col{ display:flex; flex-direction:column; gap:1.4vh; }
  .center{ align-items:center; justify-content:center; text-align:center; }
  .grow{ flex:1; }
  .card{
    background:linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid #2c374d;
    border-radius:1.6vh;
    padding:2.4vh 2.4vw;
    box-shadow:0 0.6vh 1.6vh rgba(0,0,0,0.35);
  }

  /* ---- Creation screen ---- */
  #tela-criacao{ gap:2vh; }
  .etapas-nav{ display:flex; justify-content:center; gap:1vw; margin-bottom:1vh; }
  .etapa-dot{
    width:2vh; height:2vh; border-radius:50%; background:#2c374d; border:2px solid #34405a;
  }
  .etapa-dot.ativa{ background:var(--gold); border-color:var(--gold); }
  .etapa-dot.concluida{ background:var(--green); border-color:var(--green); }

  .etapa-conteudo{ flex:1; display:none; flex-direction:column; gap:2vh; align-items:center; overflow-y:auto; padding-bottom:2vh;}
  .etapa-conteudo.ativa{ display:flex; }

  #nome-display{
    font-size:4vh; color:var(--gold); min-height:6vh; letter-spacing:2px;
    border-bottom:0.3vh solid var(--gold-dim); padding:1vh 4vw; min-width:40vw; text-align:center;
  }
  #teclado{ display:grid; grid-template-columns:repeat(10, 1fr); gap:0.8vh; max-width:80vw; }
  #teclado .btn{ padding:1.4vh 0; font-size:2vh; }
  #teclado .btn.wide{ grid-column:span 3; }

  .opcoes-grandes{ display:flex; flex-wrap:wrap; gap:1.6vh; justify-content:center; max-width:85vw; }
  .opcoes-grandes .btn{ min-width:16vw; }

  #canvas-bandeira{ border:0.4vh solid var(--gold-dim); border-radius:0.8vh; cursor:pointer; background:#000; }
  .paleta{ display:flex; flex-wrap:wrap; gap:0.8vh; max-width:60vw; justify-content:center; }
  .cor-swatch{
    width:4.4vh; height:4.4vh; border-radius:0.8vh; border:2px solid #34405a; cursor:pointer;
  }
  .cor-swatch.selecionada{ border-color:var(--gold); transform:scale(1.1); box-shadow:0 0 1vh var(--gold); }
  .simbolo-btn{ font-size:2.6vh; padding:1.2vh 1.6vw; }

  .bandeira-mini{ border:1px solid #34405a; border-radius:0.4vh; vertical-align:middle; }

  /* ---- Resumo screen ---- */
  #tela-resumo{ align-items:center; justify-content:center; gap:3vh; }
  .badges{ display:flex; gap:1.6vw; flex-wrap:wrap; justify-content:center; }
  .badge{ background:var(--card); border:1px solid #34405a; border-radius:1.2vh; padding:1.6vh 2vw; text-align:center; min-width:14vw; }
  .badge .valor{ font-size:3.4vh; color:var(--gold); font-weight:700; }

  /* ---- Main game screen ---- */
  #tela-jogo{ padding:1.6vh 2vw; gap:1.4vh; }
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border-radius:1.2vh; padding:1.2vh 2vw; border:1px solid #2c374d;
  }
  .topbar-left{ display:flex; align-items:center; gap:1.2vw; }
  .topbar-nome{ font-size:2.4vh; color:var(--gold); font-weight:700; }
  .topbar-sub{ font-size:1.6vh; color:var(--text-dim); }
  .topbar-turno{ font-size:2.2vh; color:var(--gold); font-weight:700; }

  .indicadores-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:1vh;
  }
  .indicador{
    background:var(--card); border:1px solid #2c374d; border-radius:1vh; padding:0.9vh 1vw;
  }
  .indicador-topo{ display:flex; justify-content:space-between; font-size:1.6vh; margin-bottom:0.5vh; }
  .indicador-nome{ color:var(--text-dim); }
  .indicador-valor{ color:var(--text); font-weight:700; }
  .indicador-barra{ width:100%; height:1.2vh; background:#0e141e; border-radius:1vh; overflow:hidden; border:1px solid #2c374d; }
  .indicador-fill{ height:100%; transition:width 0.5s ease, background 0.5s ease; }
  .indicador.mudou-pos{ box-shadow:0 0 1vh var(--green); }
  .indicador.mudou-neg{ box-shadow:0 0 1vh var(--red); }

  .evento-card{ flex:1; display:flex; flex-direction:column; gap:1.4vh; overflow-y:auto; }
  .evento-titulo{ display:flex; align-items:center; gap:1vw; }
  .evento-emoji{ font-size:4vh; }
  .evento-desc{ font-size:2.2vh; color:var(--text); line-height:1.5; }
  .evento-opcoes{ display:grid; grid-template-columns:1fr 1fr; gap:1.2vh; }
  .opcao-btn{ text-align:left; font-size:1.9vh; line-height:1.35; padding:1.6vh 1.6vw; }
  .opcao-btn.escolhida{ background:linear-gradient(180deg, var(--gold), var(--gold-dim)); color:#1a1305; }
  .resultado-box{
    background:var(--bg2); border:1px solid var(--gold-dim); border-radius:1vh; padding:1.4vh 1.6vw;
    display:flex; flex-direction:column; gap:0.6vh;
  }
  .efeito-tag{
    display:inline-block; padding:0.4vh 1vw; border-radius:2vh; font-size:1.7vh; margin:0.2vh; font-weight:700;
  }
  .efeito-pos{ background:rgba(76,175,80,0.2); color:#7bd881; border:1px solid #4caf50; }
  .efeito-neg{ background:rgba(231,76,60,0.2); color:#f08a7e; border:1px solid #e74c3c; }

  .footer-jogo{ display:flex; justify-content:space-between; gap:1vw; }

  .historico-painel{
    position:absolute; right:1.5vw; top:9vh; bottom:2vh; width:26vw; background:var(--card);
    border:1px solid var(--gold-dim); border-radius:1.2vh; padding:1.6vh; overflow-y:auto; z-index:20;
    box-shadow:-0.5vw 0 2vh rgba(0,0,0,0.5);
  }
  .historico-item{ border-bottom:1px solid #2c374d; padding:0.8vh 0; font-size:1.7vh; }

  /* ---- War screen ---- */
  #tela-guerra{ gap:1.4vh; padding:1.6vh 2vw; }
  .guerra-header{ text-align:center; }
  .guerra-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1vh; }
  .guerra-stat{ background:var(--card); border:1px solid #5c1c1c; border-radius:1vh; padding:1vh; text-align:center; }
  .guerra-stat .lbl{ font-size:1.5vh; color:var(--text-dim); }
  .guerra-stat .val{ font-size:2.4vh; color:var(--gold); font-weight:700; }
  .fase-badge{ display:inline-block; background:var(--red); color:white; padding:0.6vh 1.6vw; border-radius:2vh; font-size:1.8vh; font-weight:700; }
  .guerra-opcoes{ display:grid; grid-template-columns:1fr 1fr; gap:1.2vh; flex:1; }
  .guerra-opcao{ text-align:left; font-size:1.9vh; padding:1.8vh 1.6vw; background:linear-gradient(180deg,#2a1818,#1a1010); border-color:#5c1c1c; }
  .guerra-opcao:hover{ border-color:var(--red); }
  .guerra-log{ max-height:14vh; overflow-y:auto; background:var(--bg2); border-radius:1vh; padding:1vh; font-size:1.6vh; }

  /* ---- End screen ---- */
  #tela-final{ align-items:center; justify-content:center; gap:2.4vh; text-align:center; }
  #final-titulo{ font-size:5vh; }
  .final-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1.2vh; max-width:80vw; }

  ::-webkit-scrollbar{ width:0.8vh; height:0.8vh; }
  ::-webkit-scrollbar-thumb{ background:#34405a; border-radius:1vh; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:900px){
    .indicadores-grid{ grid-template-columns:repeat(2,1fr); }
    .evento-opcoes{ grid-template-columns:1fr; }
    .guerra-opcoes{ grid-template-columns:1fr; }
    .guerra-stats{ grid-template-columns:repeat(2,1fr); }
    .historico-painel{ width:70vw; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== TELA DE CRIAÇÃO ===================== -->
  <section id="tela-criacao" class="screen active">
    <h1 style="text-align:center;">🏛️ KARMA: GOVERNANDO NAÇÕES</h1>
    <div class="etapas-nav" id="etapas-nav"></div>

    <!-- Etapa 1: Nome -->
    <div class="etapa-conteudo ativa" data-etapa="1">
      <h2>Escolha o nome da sua nação</h2>
      <div id="nome-display">_</div>
      <div id="teclado"></div>
    </div>

    <!-- Etapa 2: Continente -->
    <div class="etapa-conteudo" data-etapa="2">
      <h2>Escolha o continente</h2>
      <div class="opcoes-grandes" id="opcoes-continente"></div>
      <p id="continente-selecionado" style="color:var(--gold);"></p>
    </div>

    <!-- Etapa 3: Governo -->
    <div class="etapa-conteudo" data-etapa="3">
      <h2>Escolha o sistema de governo</h2>
      <div class="opcoes-grandes" id="opcoes-governo"></div>
      <p id="governo-selecionado" style="color:var(--gold);"></p>
    </div>

    <!-- Etapa 4: Bandeira -->
    <div class="etapa-conteudo" data-etapa="4">
      <h2>Crie a bandeira da sua nação</h2>
      <canvas id="canvas-bandeira" width="400" height="260"></canvas>
      <div class="row center">
        <div class="paleta" id="paleta-cores"></div>
      </div>
      <div class="row center" id="simbolos-container"></div>
      <div class="row center" id="presets-container"></div>
    </div>

    <div class="row" style="justify-content:space-between; margin-top:1.4vh;">
      <button class="btn" id="btn-voltar-etapa">◀ Voltar</button>
      <button class="btn primary big" id="btn-avancar-etapa">Avançar ▶</button>
    </div>
  </section>

  <!-- ===================== TELA DE RESUMO ===================== -->
  <section id="tela-resumo" class="screen">
    <h1>Resumo da sua Nação</h1>
    <canvas id="canvas-resumo-bandeira" width="360" height="234" class="bandeira-mini"></canvas>
    <h2 id="resumo-nome"></h2>
    <p id="resumo-info" style="color:var(--text-dim); font-size:2.4vh;"></p>
    <div class="badges">
      <div class="badge"><div>☯ Karma</div><div class="valor">50</div></div>
      <div class="badge"><div>💰 Economia</div><div class="valor">50</div></div>
      <div class="badge"><div>⚔️ Força Militar</div><div class="valor">30</div></div>
    </div>
    <button class="btn primary big" id="btn-comecar-governar">Começar a Governar ▶</button>
  </section>

  <!-- ===================== TELA PRINCIPAL DO JOGO ===================== -->
  <section id="tela-jogo" class="screen">
    <div class="topbar">
      <div class="topbar-left">
        <canvas id="canvas-topo-bandeira" width="64" height="42" class="bandeira-mini"></canvas>
        <div>
          <div class="topbar-nome" id="topo-nome"></div>
          <div class="topbar-sub" id="topo-info"></div>
        </div>
      </div>
      <div class="topbar-turno">Turno <span id="topo-turno">1</span></div>
    </div>

    <div class="indicadores-grid" id="indicadores-grid"></div>

    <div class="card evento-card">
      <div class="evento-titulo">
        <span class="evento-emoji" id="evento-emoji">📋</span>
        <h3 id="evento-titulo-txt">Carregando...</h3>
      </div>
      <p class="evento-desc" id="evento-desc"></p>
      <div class="evento-opcoes" id="evento-opcoes"></div>
      <div class="resultado-box hidden" id="resultado-box"></div>
    </div>

    <div class="footer-jogo">
      <button class="btn" id="btn-historico">📜 Histórico</button>
      <button class="btn primary big hidden" id="btn-proximo-turno">Próximo Turno ▶</button>
    </div>

    <div class="historico-painel hidden" id="historico-painel">
      <h3>📜 Últimas Decisões</h3>
      <div id="historico-lista"></div>
      <button class="btn small" id="btn-fechar-historico" style="margin-top:1vh;">Fechar</button>
    </div>
  </section>

  <!-- ===================== TELA DE GUERRA ===================== -->
  <section id="tela-guerra" class="screen">
    <div class="guerra-header">
      <h1 style="color:var(--red);">⚔️ ESTADO DE GUERRA</h1>
      <p id="guerra-inimigo" style="font-size:2.4vh;"></p>
      <span class="fase-badge" id="guerra-fase-badge">Fase 1</span>
    </div>
    <div class="guerra-stats" id="guerra-stats"></div>
    <div class="card grow">
      <h3 id="guerra-fase-titulo"></h3>
      <p id="guerra-fase-desc" style="margin:1vh 0;"></p>
      <div class="guerra-opcoes" id="guerra-opcoes"></div>
      <div class="resultado-box hidden" id="guerra-resultado"></div>
    </div>
    <div class="guerra-log" id="guerra-log"></div>
    <div style="text-align:right;">
      <button class="btn primary big hidden" id="btn-guerra-continuar">Continuar ▶</button>
    </div>
  </section>

  <!-- ===================== TELA FINAL ===================== -->
  <section id="tela-final" class="screen">
    <h1 id="final-titulo"></h1>
    <canvas id="canvas-final-bandeira" width="360" height="234" class="bandeira-mini"></canvas>
    <p id="final-msg" style="font-size:2.4vh; max-width:60vw;"></p>
    <div class="final-stats" id="final-stats"></div>
    <button class="btn primary big" id="btn-jogar-novamente">🔄 Jogar Novamente</button>
  </section>

</div>
<script>
/* =========================================================================
   KARMA: GOVERNANDO NAÇÕES — DADOS DO JOGO (parte 1)
   Indicadores, nações estrangeiras e eventos universais.
   ========================================================================= */

// ---- Metadados dos indicadores (chaves curtas usadas nos efeitos) ----
const IND_META = {
  k:  { nome:'Karma',                    emoji:'☯️', cor:'#e8c87a' },
  ec: { nome:'Economia',                 emoji:'💰', cor:'#4caf50' },

// ---- Nações estrangeiras pré-definidas ----
const NACOES_BASE = [
  { nome:'Arcádia',    atitude:'amigavel', militar:70, economia:65, relacao:65 },
  { nome:'Valdória',   atitude:'neutra',   militar:60, economia:55, relacao:50 },

// ---- 30 Situações universais ----
const EVENTOS_UNIVERSAIS = [
{ id:'u01', tt:'Furacão Devastador', em:'🌀', d:'Um furacão de categoria 5 atinge a costa da nação, destruindo cidades inteiras e deixando milhares desabrigados.',
  o:[

function clamp(v, min=0, max=100){ return Math.max(min, Math.min(max, v)); }
function rand(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function escolherAleatorio(arr){ return arr[rand(0, arr.length - 1)]; }
function $(sel){ return document.querySelector(sel); }

function initTeclado(){
  const teclado = $('#teclado');
  if (!teclado) return;
  teclado.innerHTML = '';
  const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  letras.forEach(l => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = l;
    b.onclick = () => digitarCaractere(l);
    teclado.appendChild(b);
  });
  const espaco = document.createElement('button');
  espaco.className = 'btn wide';
  espaco.textContent = 'ESPAÇO';
  espaco.onclick = () => digitarCaractere(' ');
  teclado.appendChild(espaco);

  const apagar = document.createElement('button');
  apagar.className = 'btn wide';
  apagar.textContent = '⌫ APAGAR';
  apagar.onclick = apagarCaractere;
  teclado.appendChild(apagar);
}
function digitarCaractere(c){
  if (G.nacao.nome.length >= 30) return;
  G.nacao.nome += c;
  atualizarNomeDisplay();
}
function apagarCaractere(){
  G.nacao.nome = G.nacao.nome.slice(0, -1);
  atualizarNomeDisplay();
}
function atualizarNomeDisplay(){
  const disp = $('#nome-display');
  disp.textContent = G.nacao.nome.length ? G.nacao.nome : '_';
}

const PALETA_CORES = [
  '#e63946','#f1a208','#f5f5f5','#1565c0','#2e7d32','#1a1a1a',
  '#e8c87a','#9b59b6','#00bcd4','#5dade2','#8b4513','#ff6f61',
  '#4caf50','#2c2c54',
];
const SIMBOLOS = ['✖','★','●','◆','✚','☽','☀'];
let faixaSelecionada = 0;

function desenharBandeira(canvas, bandeira){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const cores = bandeira.cores;
  const estilo = bandeira.estilo || 'horizontal';

  if (estilo === 'horizontal'){
    const fh = h / 3;
    cores.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * fh, w, fh); });
  } else if (estilo === 'vertical'){
    const fw = w / 3;
    cores.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(i * fw, 0, fw, h); });
  } else if (estilo === 'cruz'){
    ctx.fillStyle = cores[0]; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = cores[1];
    ctx.fillRect(w*0.4, 0, w*0.2, h);
    ctx.fillRect(0, h*0.4, w, h*0.2);
    ctx.fillStyle = cores[2];
    ctx.fillRect(w*0.46, h*0.46, w*0.08, h*0.08);
  } else if (estilo === 'diagonal'){
    ctx.fillStyle = cores[0]; ctx.fillRect(0, 0, w, h);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w,0); ctx.lineTo(0,h); ctx.closePath();
    ctx.fillStyle = cores[1]; ctx.fill();
    ctx.beginPath(); ctx.moveTo(w,h); ctx.lineTo(w,0); ctx.lineTo(0,h); ctx.closePath();
    ctx.fillStyle = cores[2]; ctx.fill();
  }

  // Símbolo central
  if (bandeira.simbolo){
    ctx.fillStyle = '#ffffffdd';
    ctx.strokeStyle = '#000000aa';
    ctx.lineWidth = Math.max(1, w * 0.006);
    ctx.font = `bold ${h * 0.32}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(bandeira.simbolo, w/2, h/2);
    ctx.strokeText(bandeira.simbolo, w/2, h/2);
  }
  // Borda
  ctx.strokeStyle = '#00000055';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, w-2, h-2);
}

function redesenharTodasBandeiras(){
  ['canvas-bandeira','canvas-resumo-bandeira','canvas-topo-bandeira','canvas-final-bandeira'].forEach(id => {
    const c = document.getElementById(id);
    if (c) desenharBandeira(c, G.nacao.bandeira);
  });
}

function initEditorBandeira(){
  const canvas = $('#canvas-bandeira');
  canvas.onclick = (ev) => {
    const rect = canvas.getBoundingClientRect();
    const scaleY = canvas.height / rect.height;
    const scaleX = canvas.width / rect.width;
    const y = (ev.clientY - rect.top) * scaleY;
    const x = (ev.clientX - rect.left) * scaleX;
    const estilo = G.nacao.bandeira.estilo;
    if (estilo === 'horizontal'){
      faixaSelecionada = Math.floor(y / (canvas.height/3));
    } else if (estilo === 'vertical'){
      faixaSelecionada = Math.floor(x / (canvas.width/3));
    } else {
      faixaSelecionada = 0;
    }
    faixaSelecionada = clamp(faixaSelecionada, 0, 2);
    marcarCorSelecionada();
  };

  const paleta = $('#paleta-cores');
  paleta.innerHTML = '';
  PALETA_CORES.forEach(cor => {
    const sw = document.createElement('div');
    sw.className = 'cor-swatch';
    sw.style.background = cor;
    sw.onclick = () => {
      G.nacao.bandeira.cores[faixaSelecionada] = cor;
      redesenharTodasBandeiras();
      marcarCorSelecionada();
    };
    paleta.appendChild(sw);
  });

  const simbCont = $('#simbolos-container');
  simbCont.innerHTML = '<h3 style="width:100%; text-align:center; margin-bottom:0.6vh;">Símbolo Central</h3>';
  SIMBOLOS.forEach(s => {
    const b = document.createElement('button');
    b.className = 'btn simbolo-btn';
    b.textContent = s;
    b.onclick = () => {
      G.nacao.bandeira.simbolo = s;
      redesenharTodasBandeiras();
      $all('#simbolos-container .btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
    };
    simbCont.appendChild(b);
  });

  const presetsCont = $('#presets-container');
  presetsCont.innerHTML = '<h3 style="width:100%; text-align:center; margin-bottom:0.6vh;">Modelos Rápidos</h3>';
  const presets = [
    { nome:'Listras H', estilo:'horizontal' },
    { nome:'Listras V', estilo:'vertical' },
    { nome:'Cruz', estilo:'cruz' },
    { nome:'Diagonal', estilo:'diagonal' },
    { nome:'Três Cores', estilo:'horizontal' },
  ];
  presets.forEach(p => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = p.nome;
    b.onclick = () => {
      G.nacao.bandeira.estilo = p.estilo;
      redesenharTodasBandeiras();
    };
    presetsCont.appendChild(b);
  });

  desenharBandeira(canvas, G.nacao.bandeira);
  marcarCorSelecionada();
}
function marcarCorSelecionada(){
  const corAtual = G.nacao.bandeira.cores[faixaSelecionada];
  $all('#paleta-cores .cor-swatch').forEach(sw => {
    sw.classList.toggle('selecionada', sw.style.background === hexParaRgb(corAtual));
  });
}
function hexParaRgb(hex){
  // Converte hex para o formato rgb que o navegador usa em style.background, para comparação
  const c = document.createElement('canvas').getContext('2d');
  c.fillStyle = hex;
  return c.fillStyle.startsWith('#') ? hex : c.fillStyle;
}

/* =========================================================================
   NAVEGAÇÃO ENTRE ETAPAS DA CRIAÇÃO
   ========================================================================= */
function initEtapasNav(){
  const nav = $('#etapas-nav');
  nav.innerHTML = '';
  for (let i = 1; i <= 4; i++){
    const dot = document.createElement('div');
    dot.className = 'etapa-dot' + (i === 1 ? ' ativa' : '');
    dot.dataset.etapa = i;
    nav.appendChild(dot);
  }
}
function irParaEtapa(n){
  if (n < 1 || n > 4) return;
  G.etapaAtual = n;
  $all('.etapa-conteudo').forEach(el => el.classList.toggle('ativa', Number(el.dataset.etapa) === n));
  $all('.etapa-dot').forEach(d => {
    const i = Number(d.dataset.etapa);
    d.classList.toggle('ativa', i === n);
    d.classList.toggle('concluida', i < n);
  });
  $('#btn-voltar-etapa').disabled = (n === 1);
  $('#btn-avancar-etapa').textContent = (n === 4) ? 'Iniciar Partida ▶' : 'Avançar ▶';
}
function validarEtapaAtual(){
  if (G.etapaAtual === 1 && !G.nacao.nome.trim()){
    alert('Por favor, digite um nome para sua nação antes de continuar.');
    return false;
  }
  if (G.etapaAtual === 2 && !G.nacao.continente){
    alert('Por favor, escolha um continente antes de continuar.');
    return false;
  }
  if (G.etapaAtual === 3 && !G.nacao.governo){
    alert('Por favor, escolha um sistema de governo antes de continuar.');
    return false;
  }
  return true;
}

/* =========================================================================
   GAMEPLAY — RENDERIZAÇÃO DE INDICADORES
   ========================================================================= */
function corBarraKarma(v){
  if (v < 34) return `rgb(${200}, ${Math.round(40+v*2)}, 40)`;
  if (v < 67) return `rgb(${Math.round(230-(v-34)*3)}, 200, 40)`;
  return `rgb(${Math.max(50,230-(v-67)*6)}, 200, 70)`;
}
function renderTopbar(){
  $('#topo-nome').textContent = G.nacao.nome;
  const govNome = GOVERNOS.find(g => g.id === G.nacao.governo).nome;
  $('#topo-info').textContent = `${G.nacao.continente} • ${govNome}`;
  $('#topo-turno').textContent = G.turno;
  redesenharTodasBandeiras();
}
function renderIndicadores(destacar){
  const grid = $('#indicadores-grid');
  grid.innerHTML = '';
  IND_ORDEM.forEach(key => {
    const meta = IND_META[key];
    const valor = clamp(Math.round(G.indicadores[key]));
    const div = document.createElement('div');
    div.className = 'indicador';
    if (destacar && destacar[key]){
      div.classList.add(destacar[key] > 0 ? 'mudou-pos' : 'mudou-neg');
    }
    const cor = (key === 'k') ? corBarraKarma(valor) : meta.cor;
    div.innerHTML = `
      <div class="indicador-topo">
        <span class="indicador-nome">${meta.emoji} ${meta.nome}</span>
        <span class="indicador-valor">${valor}</span>
      </div>
      <div class="indicador-barra"><div class="indicador-fill" style="width:${valor}%; background:${cor};"></div></div>
    `;
    grid.appendChild(div);
  });
}

/* =========================================================================
   GAMEPLAY — SELEÇÃO E EXIBIÇÃO DE EVENTOS
   ========================================================================= */
function poolEventosDisponiveis(){
  const governoEventos = EVENTOS_GOVERNO[G.nacao.governo] || [];
  return [...EVENTOS_UNIVERSAIS, ...governoEventos];
}
function gerarEventoDiplomatico(){
  const nacao = escolherAleatorio(G.nacoes);
  const tipos = [
    { tt:'Oferta de Comércio', em:'🤝', d:`${nacao.nome} propõe um novo acordo comercial bilateral, prometendo benefícios mútuos.`,
      o:[
        { t:'Aceitar o acordo comercial integralmente', e:{ri:8,ec:6}, rel:8 },
        { t:'Negociar termos mais favoráveis', e:{ri:3,ec:3}, rel:3 },
        { t:'Recusar por proteção à indústria local', e:{ec:4,ri:-5}, rel:-5 },
        { t:'Propor acordo alternativo mais amplo', e:{ri:6,ec:2}, rel:6 },
      ]},
    { tt:'Tensão Diplomática', em:'⚡', d:`Autoridades de ${nacao.nome} fazem declarações hostis contra sua nação em fóruns internacionais.`,
      o:[
        { t:'Responder com diplomacia e moderação', e:{ri:4,k:3}, rel:6 },
        { t:'Responder à altura, com firmeza', e:{fm:2,ri:-4}, rel:-6 },
        { t:'Ignorar as provocações publicamente', e:{es:2}, rel:0 },
        { t:'Buscar mediação de organismos internacionais', e:{ri:5,k:2}, rel:4 },
      ]},
    { tt:'Proposta de Aliança', em:'🛡️', d:`${nacao.nome} propõe uma aliança estratégica de defesa mútua.`,
      o:[
        { t:'Aceitar a aliança plenamente', e:{ri:8,fm:4}, rel:10 },
        { t:'Aceitar cooperação limitada', e:{ri:4,fm:1}, rel:5 },
        { t:'Recusar para manter independência', e:{es:2,ri:-3}, rel:-4 },
        { t:'Propor pacto de não-agressão em vez disso', e:{ri:5}, rel:5 },
      ]},
    { tt:'Sanções Econômicas', em:'🚫', d:`${nacao.nome} ameaça impor sanções econômicas devido a divergências políticas.`,
      o:[
        { t:'Negociar para evitar as sanções', e:{ri:5,ec:-2}, rel:5 },
        { t:'Aceitar as sanções e buscar autonomia', e:{ec:-8,es:3}, rel:-6 },
        { t:'Retaliar com sanções próprias', e:{ec:-6,ri:-8,fm:2}, rel:-10 },
        { t:'Buscar apoio de outras nações aliadas', e:{ri:4,ec:-2}, rel:2 },
      ]},
    { tt:'Cúpula Internacional', em:'🌐', d:`${nacao.nome} convida sua nação para uma cúpula internacional sobre cooperação global.`,
      o:[
        { t:'Participar ativamente e propor iniciativas', e:{ri:7,r:4}, rel:7 },
        { t:'Participar de forma discreta', e:{ri:3}, rel:2 },
        { t:'Enviar apenas representantes de baixo escalão', e:{ri:-2,r:-2}, rel:-2 },
        { t:'Recusar o convite', e:{ri:-5,es:1}, rel:-5 },
      ]},
  ];
  const modelo = escolherAleatorio(tipos);
  return { id:'dip-'+Date.now(), tt:modelo.tt, em:modelo.em, d:modelo.d, o:modelo.o, diplomatico:true, nacaoAlvo:nacao.nome };
}
function selecionarProximoEvento(){
  // 22% de chance de evento diplomático
  if (Math.random() < 0.22){
    return gerarEventoDiplomatico();
  }
  const pool = poolEventosDisponiveis();
  let disponiveis = pool.filter(ev => !G.historicoEventosIds.includes(ev.id));
  if (disponiveis.length === 0){
    G.historicoEventosIds = [];
    disponiveis = pool;
  }
  const escolhido = escolherAleatorio(disponiveis);
  G.historicoEventosIds.push(escolhido.id);
  if (G.historicoEventosIds.length > 15) G.historicoEventosIds.shift();
  return escolhido;
}
function gerarEvento(){
  if (G.fimJogo) return;
  if (G.guerra) { iniciarTelaGuerra(); return; }
  G.eventoAtual = selecionarProximoEvento();
  G.opcaoEscolhidaIdx = null;
  renderEvento();
  mostrarTela('tela-jogo');
}
function renderEvento(){
  const ev = G.eventoAtual;
  if (!ev){
    // Fallback de segurança: nunca deixar o card vazio
    G.eventoAtual = { id:'fallback', tt:'Análise da Situação', em:'📋', d:'Sua equipe analisa o cenário atual do país.',
      o:[{t:'Analisar a situação com calma', e:{es:2}},{t:'Convocar reunião de ministros', e:{es:1,ec:-1}},
         {t:'Consultar a população', e:{k:2}},{t:'Manter o rumo atual', e:{}}] };
  }
  $('#evento-emoji').textContent = ev.em || '📋';
  $('#evento-titulo-txt').textContent = ev.tt || 'Situação';
  $('#evento-desc').textContent = ev.d || '';
  const opcoesDiv = $('#evento-opcoes');
  opcoesDiv.innerHTML = '';
  const opcoes = (ev.o && ev.o.length) ? ev.o : [{t:'Analisar situação', e:{}}];
  opcoes.forEach((op, idx) => {
    const b = document.createElement('button');
    b.className = 'btn opcao-btn';
    b.textContent = op.t;
    b.onclick = () => escolherOpcao(idx);
    opcoesDiv.appendChild(b);
  });
  $('#resultado-box').classList.add('hidden');
  $('#resultado-box').innerHTML = '';
  $('#btn-proximo-turno').classList.add('hidden');
}
function escolherOpcao(idx){
  if (G.opcaoEscolhidaIdx !== null) return; // evita cliques duplicados
  G.opcaoEscolhidaIdx = idx;
  const ev = G.eventoAtual;
  const opcoes = (ev.o && ev.o.length) ? ev.o : [{t:'Analisar situação', e:{}}];
  const opcao = opcoes[idx];

  $all('#evento-opcoes .opcao-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === idx) b.classList.add('escolhida');
  });

  const efeitos = aplicarEfeitos(opcao.e || {});

  // Ajusta relação com nação-alvo em eventos diplomáticos
  if (ev.diplomatico && ev.nacaoAlvo && typeof opcao.rel === 'number'){
    const nacao = G.nacoes.find(n => n.nome === ev.nacaoAlvo);
    if (nacao){
      nacao.relacao = clamp(nacao.relacao + opcao.rel);
      if (nacao.relacao > 60) nacao.atitude = 'amigavel';
      else if (nacao.relacao < 30) nacao.atitude = 'hostil';
      else nacao.atitude = 'neutra';
    }
  }

  registrarHistorico(ev.tt, opcao.t);
  renderResultado(efeitos);
  renderIndicadores(efeitos);
  verificarGatilhoDeGuerra(opcao.t);

  if (!checarFimDeJogo()){
    if (G.guerra){
      $('#btn-proximo-turno').textContent = '⚔️ Ir para o Front de Guerra ▶';
      $('#btn-proximo-turno').classList.remove('hidden');
      $('#btn-proximo-turno').onclick = () => { iniciarTelaGuerra(); };
    } else {
      $('#btn-proximo-turno').textContent = 'Próximo Turno ▶';
      $('#btn-proximo-turno').classList.remove('hidden');
      $('#btn-proximo-turno').onclick = proximoTurno;
    }
  }
}
function aplicarEfeitos(efeitosObj){
  const aplicados = {};
  Object.keys(efeitosObj).forEach(key => {
    if (!IND_META[key]) return; // ignora chaves não-indicador (usadas na guerra)
    const delta = efeitosObj[key];
    G.indicadores[key] = clamp(G.indicadores[key] + delta);
    aplicados[key] = delta;
  });
  return aplicados;
}
function renderResultado(efeitos){
  const box = $('#resultado-box');
  box.classList.remove('hidden');
  const tagsHtml = Object.keys(efeitos).map(key => {
    const meta = IND_META[key];
    const delta = efeitos[key];
    if (delta === 0) return '';
    const cls = delta > 0 ? 'efeito-pos' : 'efeito-neg';
    const sinal = delta > 0 ? '+' : '';
    return `<span class="efeito-tag ${cls}">${meta.emoji} ${meta.nome} ${sinal}${delta}</span>`;
  }).join('');
  box.innerHTML = `<strong>Consequências da decisão:</strong><div>${tagsHtml || '<span style="color:var(--text-dim);">Nenhum efeito imediato perceptível.</span>'}</div>`;
}
function registrarHistorico(titulo, escolha){
  G.historicoDecisoes.unshift({ turno:G.turno, titulo, escolha });
  if (G.historicoDecisoes.length > 10) G.historicoDecisoes.pop();
}
function renderHistorico(){
  const lista = $('#historico-lista');
  if (!G.historicoDecisoes.length){
    lista.innerHTML = '<p style="color:var(--text-dim);">Nenhuma decisão registrada ainda.</p>';
    return;
  }
  lista.innerHTML = G.historicoDecisoes.map(h =>
    `<div class="historico-item"><strong>Turno ${h.turno}:</strong> ${h.titulo}<br><span style="color:var(--text-dim);">→ ${h.escolha}</span></div>`
  ).join('');
}

function proximoTurno(){
  if (G.fimJogo) return;
  G.turno += 1;
  renderTopbar();
  gerarEvento();
}

/* =========================================================================
   VERIFICAÇÃO DE FIM DE JOGO
   ========================================================================= */
function checarFimDeJogo(){
  if (G.fimJogo) return true;
  if (G.indicadores.k >= 100){
    finalizarJogo('vitoria', 'A nação atingiu a harmonia máxima! O povo vive em paz, prosperidade e justiça sob sua liderança.');
    return true;
  }
  if (G.indicadores.k <= 0){
    finalizarJogo('derrota', 'O Karma da nação chegou ao fundo do poço. Crises, injustiças e o descontentamento popular derrubaram seu governo.');
    return true;
  }
  return false;
}
function finalizarJogo(resultado, mensagem){
  if (G.fimJogo) return; // evita chamadas duplicadas
  G.fimJogo = true;
  setTimeout(() => mostrarTelaFinal(resultado, mensagem), 900);
}
function mostrarTelaFinal(resultado, mensagem){
  const titulo = $('#final-titulo');
  if (resultado === 'vitoria'){
    titulo.textContent = '🏆 VITÓRIA! Karma Máximo Alcançado';
    titulo.style.color = 'var(--gold)';
  } else if (resultado === 'derrota'){
    titulo.textContent = '💔 DERROTA — O Governo Caiu';
    titulo.style.color = 'var(--red)';
  } else {
    titulo.textContent = '🏁 FIM DE JOGO';
    titulo.style.color = 'var(--gold)';
  }
  $('#final-msg').textContent = mensagem;
  redesenharTodasBandeiras();
  const statsDiv = $('#final-stats');
  statsDiv.innerHTML = IND_ORDEM.map(key => {
    const meta = IND_META[key];
    return `<div class="badge"><div>${meta.emoji} ${meta.nome}</div><div class="valor">${clamp(Math.round(G.indicadores[key]))}</div></div>`;
  }).join('') + `<div class="badge"><div>📅 Turnos Jogados</div><div class="valor">${G.turno}</div></div>`;
  mostrarTela('tela-final');
}

/* =========================================================================
   SISTEMA DE GUERRA
   ========================================================================= */
function palavrasAgressivas(texto){
  const t = texto.toLowerCase();
  return ['ataque','ataca','mobilizar','ameaça','ameacar','invasão','invasao','bombardeio','ofensiva'].some(p => t.includes(p));
}
function verificarGatilhoDeGuerra(textoOpcaoEscolhida){
  if (G.guerra || G.fimJogo) return;
  // Gatilho 1: relação com alguma nação caiu abaixo de 15
  const nacoesHostis = G.nacoes.filter(n => n.relacao < 15);
  let chance = 0;
  let nacaoGatilho = null;
  if (nacoesHostis.length){
    chance += 0.30;
    nacaoGatilho = escolherAleatorio(nacoesHostis);
  }
  // Gatilho 2: decisão agressiva do jogador
  if (textoOpcaoEscolhida && palavrasAgressivas(textoOpcaoEscolhida)){
    chance += 0.15;
    if (!nacaoGatilho) nacaoGatilho = escolherAleatorio(G.nacoes.filter(n => n.atitude !== 'amigavel')) || escolherAleatorio(G.nacoes);
  }
  if (chance > 0 && Math.random() < chance && nacaoGatilho){
    declararGuerra(nacaoGatilho);
  }
}
function declararGuerra(nacaoInimiga){
  const aliadosIniciais = G.nacoes.filter(n => n.relacao > 60).length;
  G.guerra = {
    nacaoInimiga: nacaoInimiga.nome,
    faseIdx: 0, // índice em FASES_GUERRA (0-6)
    economia: clamp(G.indicadores.ec),
    forcaMilitar: clamp(G.indicadores.fm),
    aliados: aliadosIniciais,
    defesas: 40,
    moral: 55,
    baixas: 0,
    recursos: 70,
    forcaInimiga: clamp(nacaoInimiga.militar + rand(-8, 8)),
    turnosGuerra: 0,
    historico: [],
    opcaoEscolhidaIdx: null,
  };
  registrarHistorico('⚔️ Declaração de Guerra', `${nacaoInimiga.nome} declarou guerra à nação!`);
}
function iniciarTelaGuerra(){
  if (!G.guerra) { gerarEvento(); return; }
  if (!G.guerra.historico) G.guerra.historico = []; // robustez
  renderTelaGuerra();
  mostrarTela('tela-guerra');
}
function renderTelaGuerra(){
  const guerra = G.guerra;
  if (!guerra) return;
  $('#guerra-inimigo').textContent = `Conflito contra: ${guerra.nacaoInimiga}`;
  const faseAtual = FASES_GUERRA[guerra.faseIdx];
  $('#guerra-fase-badge').textContent = `Fase ${faseAtual.fase} de 7 — ${faseAtual.nome}`;
  $('#guerra-fase-titulo').textContent = `${faseAtual.emoji} ${faseAtual.nome}`;
  $('#guerra-fase-desc').textContent = faseAtual.desc;

  renderGuerraStats();

  const opcoesDiv = $('#guerra-opcoes');
  opcoesDiv.innerHTML = '';
  faseAtual.o.forEach((op, idx) => {
    const b = document.createElement('button');
    b.className = 'btn guerra-opcao';
    b.textContent = op.t;
    b.onclick = () => escolherOpcaoGuerra(idx);
    opcoesDiv.appendChild(b);
  });
  $('#guerra-resultado').classList.add('hidden');
  $('#guerra-resultado').innerHTML = '';
  $('#btn-guerra-continuar').classList.add('hidden');
  guerra.opcaoEscolhidaIdx = null;
  renderGuerraLog();
}
function renderGuerraStats(){
  const guerra = G.guerra;
  const stats = [
    { lbl:'💰 Economia de Guerra', val: clamp(Math.round(guerra.economia)) },
    { lbl:'⚔️ Força Militar', val: clamp(Math.round(guerra.forcaMilitar || G.indicadores.fm)) },
    { lbl:'🤝 Aliados', val: guerra.aliados },
    { lbl:'🛡️ Defesas', val: clamp(Math.round(guerra.defesas)) },
    { lbl:'💪 Moral das Tropas', val: clamp(Math.round(guerra.moral)) },
    { lbl:'💀 Baixas', val: Math.max(0, Math.round(guerra.baixas)) },
    { lbl:'🏴 Força Inimiga', val: clamp(Math.round(guerra.forcaInimiga)) },
    { lbl:'📦 Recursos', val: clamp(Math.round(guerra.recursos)) },
  ];
  $('#guerra-stats').innerHTML = stats.map(s =>
    `<div class="guerra-stat"><div class="lbl">${s.lbl}</div><div class="val">${s.val}</div></div>`
  ).join('');
}
function escolherOpcaoGuerra(idx){
  const guerra = G.guerra;
  if (!guerra || guerra.opcaoEscolhidaIdx !== null) return;
  guerra.opcaoEscolhidaIdx = idx;
  const faseAtual = FASES_GUERRA[guerra.faseIdx];
  const opcao = faseAtual.o[idx];

  $all('#guerra-opcoes .guerra-opcao').forEach((b, i) => {
    b.disabled = true;
    if (i === idx) b.classList.add('escolhida');
  });

  // Aplica efeitos de indicadores globais
  const efeitosGlobais = aplicarEfeitos(opcao.e || {});
  // Aplica efeitos específicos da guerra
  const e = opcao.e || {};
  if (e.def) guerra.defesas = clamp(guerra.defesas + e.def);
  if (e.moral) guerra.moral = clamp(guerra.moral + e.moral);
  if (e.bx) guerra.baixas += e.bx;
  if (e.rec) guerra.recursos = clamp(guerra.recursos + e.rec);
  if (e.al) guerra.aliados = Math.max(0, guerra.aliados + e.al);
  if (e.fi) guerra.forcaInimiga = clamp(guerra.forcaInimiga + e.fi);
  guerra.economia = clamp(G.indicadores.ec);
  guerra.forcaMilitar = clamp(G.indicadores.fm);
  guerra.turnosGuerra += 1;

  // Cálculo de combate (imprevisibilidade)
  const forcaAliada = (guerra.forcaMilitar*0.35 + guerra.economia*0.2 + guerra.moral*0.25 + guerra.recursos*0.2);
  const diff = forcaAliada - guerra.forcaInimiga + rand(-10, 10);
  let resultadoCombate;
  if (diff > 12) resultadoCombate = 'Vantagem tática decisiva! Nossas forças avançam.';
  else if (diff > 0) resultadoCombate = 'Ligeira vantagem em campo.';
  else if (diff > -12) resultadoCombate = 'Combate equilibrado, sem vantagem clara.';
  else resultadoCombate = 'Revés tático! O inimigo ganha terreno.';

  if (diff < -12){
    guerra.moral = clamp(guerra.moral - 8);
    guerra.defesas = clamp(guerra.defesas - 6);
    guerra.baixas += rand(2, 6);
  } else if (diff > 12){
    guerra.forcaInimiga = clamp(guerra.forcaInimiga - 5);
  }

  guerra.historico.unshift(`Fase ${faseAtual.fase} — ${opcao.t}: ${resultadoCombate}`);
  if (guerra.historico.length > 8) guerra.historico.pop();

  renderGuerraResultado(efeitosGlobais, resultadoCombate);
  renderGuerraStats();
  renderGuerraLog();

  // Verifica derrota forçada por colapso de defesas/moral
  let desfechoForcado = null;
  if (guerra.moral <= 0 || guerra.defesas <= 0){
    desfechoForcado = 'derrota';
  } else if (guerra.forcaInimiga <= 0){
    desfechoForcado = 'vitoria';
  }

  const btnContinuar = $('#btn-guerra-continuar');
  btnContinuar.classList.remove('hidden');

  if (desfechoForcado === 'derrota'){
    btnContinuar.textContent = 'Ver Consequências ▶';
    btnContinuar.onclick = () => concluirGuerra('derrota');
  } else if (desfechoForcado === 'vitoria'){
    btnContinuar.textContent = 'Ver Consequências ▶';
    btnContinuar.onclick = () => concluirGuerra('vitoria');
  } else if (opcao.encerraGuerra === 'paz'){
    btnContinuar.textContent = 'Selar a Paz ▶';
    btnContinuar.onclick = () => concluirGuerra('paz');
  } else if (opcao.encerraGuerra === 'derrota'){
    btnContinuar.textContent = 'Ver Consequências ▶';
    btnContinuar.onclick = () => concluirGuerra('derrota');
  } else if (opcao.encerraGuerra === 'decisivo'){
    btnContinuar.textContent = 'Ver Desfecho Final ▶';
    btnContinuar.onclick = () => concluirGuerra(diff > 0 ? 'vitoria' : 'derrota');
  } else if (guerra.faseIdx >= FASES_GUERRA.length - 1){
    // Chegou ao fim da fase 7 sem opção de encerramento explícita (segurança)
    btnContinuar.textContent = 'Ver Desfecho Final ▶';
    btnContinuar.onclick = () => concluirGuerra(diff > 0 ? 'vitoria' : 'derrota');
  } else {
    btnContinuar.textContent = 'Avançar para a Próxima Fase ▶';
    btnContinuar.onclick = avancarFaseGuerra;
  }

  if (checarFimDeJogo()){
    btnContinuar.classList.add('hidden');
  }
}
function renderGuerraResultado(efeitosGlobais, resultadoCombate){
  const box = $('#guerra-resultado');
  box.classList.remove('hidden');
  const tagsHtml = Object.keys(efeitosGlobais).map(key => {
    const meta = IND_META[key];
    const delta = efeitosGlobais[key];
    if (delta === 0) return '';
    const cls = delta > 0 ? 'efeito-pos' : 'efeito-neg';
    const sinal = delta > 0 ? '+' : '';
    return `<span class="efeito-tag ${cls}">${meta.emoji} ${meta.nome} ${sinal}${delta}</span>`;
  }).join('');
  box.innerHTML = `<strong>🎯 ${resultadoCombate}</strong><div>${tagsHtml}</div>`;
}
function renderGuerraLog(){
  const guerra = G.guerra;
  if (!guerra || !guerra.historico){ $('#guerra-log').innerHTML = ''; return; }
  $('#guerra-log').innerHTML = '<strong>📖 Relatório de Guerra:</strong><br>' +
    guerra.historico.map(h => `<div>• ${h}</div>`).join('');
}
function avancarFaseGuerra(){
  if (!G.guerra) return;
  G.guerra.faseIdx = Math.min(G.guerra.faseIdx + 1, FASES_GUERRA.length - 1);
  renderTelaGuerra();
}
function concluirGuerra(resultado){
  if (!G.guerra) { gerarEvento(); return; }
  if (resultado === 'vitoria'){
    aplicarEfeitos({ k:30, r:10, ri:5 });
    registrarHistorico('🏆 Fim da Guerra', `Vitória contra ${G.guerra.nacaoInimiga}!`);
  } else if (resultado === 'derrota'){
    aplicarEfeitos({ k:-25, r:-10, es:-8 });
    registrarHistorico('💥 Fim da Guerra', `Derrota diante de ${G.guerra.nacaoInimiga}.`);
  } else if (resultado === 'paz'){
    aplicarEfeitos({ k:6, ri:6 });
    registrarHistorico('🕊️ Fim da Guerra', `Paz selada com ${G.guerra.nacaoInimiga}.`);
  }
  // Restaura relação minimamente com o antigo inimigo após o fim do conflito
  const nacao = G.nacoes.find(n => n.nome === G.guerra.nacaoInimiga);
  if (nacao){
    nacao.relacao = clamp(resultado === 'derrota' ? nacao.relacao + 5 : nacao.relacao + 20);
    nacao.atitude = nacao.relacao > 60 ? 'amigavel' : (nacao.relacao < 30 ? 'hostil' : 'neutra');
  }
  G.guerra = null;
  renderIndicadores();
  if (!checarFimDeJogo()){
    proximoTurno();
  }
}

/* =========================================================================
   INICIALIZAÇÃO E EVENT LISTENERS GERAIS
   ========================================================================= */
function iniciarPartida(){
  redesenharTodasBandeiras();
  renderTopbar();
  renderIndicadores();
  gerarEvento();
  mostrarTela('tela-jogo');
}
function reiniciarJogo(){
  estadoInicial();
  faixaSelecionada = 0;
  initTeclado();
  atualizarNomeDisplay();
  initContinentes();
  initGovernos();
  initEditorBandeira();
  initEtapasNav();
  irParaEtapa(1);
  mostrarTela('tela-criacao');
}

function setupListeners(){
  $('#btn-avancar-etapa').onclick = () => {
    if (!validarEtapaAtual()) return;
    if (G.etapaAtual < 4){
      irParaEtapa(G.etapaAtual + 1);
    } else {
      mostrarResumo();
    }
  };
  $('#btn-voltar-etapa').onclick = () => irParaEtapa(G.etapaAtual - 1);
  $('#btn-comecar-governar').onclick = iniciarPartida;
  $('#btn-historico').onclick = () => { renderHistorico(); $('#historico-painel').classList.remove('hidden'); };
  $('#btn-fechar-historico').onclick = () => $('#historico-painel').classList.add('hidden');
  $('#btn-jogar-novamente').onclick = reiniciarJogo;
}

document.addEventListener('DOMContentLoaded', () => {
  initTeclado();
  atualizarNomeDisplay();
  initContinentes();
  initGovernos();
  initEditorBandeira();
  initEtapasNav();
  irParaEtapa(1);
  setupListeners();
  mostrarTela('tela-criacao');
});

</script>
